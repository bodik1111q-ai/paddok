<title>Паддок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column, timing-screen language. Stat bars use sector colours:
   yellow = slower, green = good, purple = best-in-class. */
:root{
  --bg:#e8ebf0; --card:#f6f7f9; --ink:#12151b; --mute:#566070; --line:#cdd3dc;
  --accent:#6a2cf5; --on-accent:#ffffff; --good:#12924a; --warn:#b98000; --bad:#d23a32;
  --track:#d9dee6;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1015; --card:#171b22; --ink:#eceef2; --mute:#98a2b2; --line:#2a313c;
    --accent:#a483ff; --on-accent:#10131a; --good:#3ccf7a; --warn:#e5b43a; --bad:#ff6b62;
    --track:#262c36; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1015; --card:#171b22; --ink:#eceef2; --mute:#98a2b2; --line:#2a313c;
  --accent:#a483ff; --on-accent:#10131a; --good:#3ccf7a; --warn:#e5b43a; --bad:#ff6b62;
  --track:#262c36; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(46px,16vw,72px);font-weight:700;letter-spacing:.01em}
h2{font-size:24px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
.lead{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.screen{display:flex;flex-direction:column;gap:14px;animation:in .22s ease-out}
@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;min-height:48px;padding:10px 16px;
  font-family:var(--f-display);font-size:18px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.opt{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;text-align:left;width:100%;
  display:flex;flex-direction:column;gap:4px}
.opt:hover{border-color:var(--accent)}
.opt strong{font-weight:600}
.opt span{color:var(--mute);font-size:14px}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
input[type=text],select{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;min-height:46px;color:var(--ink);width:100%}
/* HUD */
.hud{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.who strong{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.who span,.meta{font-family:var(--f-data);font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.st{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:12px;color:var(--mute)}
.st em{font-family:var(--f-data);font-style:normal;color:var(--ink);font-size:12px}
.bar{grid-column:1/3;height:6px;background:var(--track);border-radius:1px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--warn)}
.bar.g b{background:var(--good)}
.bar.p b{background:var(--accent)}
.sbtn{background:none;border:1px solid var(--line);color:inherit;border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
.fbar{display:flex;align-items:flex-end;gap:4px;height:90px;margin:10px 0}.fbar i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-width:4px}
details.champs summary{cursor:pointer;font-weight:600}
.mini{display:flex;gap:18px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.mini b{font-family:var(--f-data);color:var(--ink)}
/* team offer */
.team{display:flex;flex-direction:column;gap:10px}
.team .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tag{font-family:var(--f-data);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.facts{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mute)}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-data);font-size:12px;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.up{color:var(--good);border-color:var(--good)}
.chip.down{color:var(--bad);border-color:var(--bad)}
/* result */
.big{display:flex;align-items:baseline;gap:12px}
.big .pos{font-family:var(--f-display);font-weight:700;font-size:84px;line-height:.9;color:var(--accent)}
.big .pos.win{color:var(--good)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nums div{display:flex;flex-direction:column;gap:0}
.nums b{font-family:var(--f-data);font-size:20px}
.nums span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.tower{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.row{display:grid;grid-template-columns:34px 5px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px;min-width:0}
.row:last-child{border-bottom:0}
.row .n{font-family:var(--f-data);color:var(--mute);text-align:right}
.row .c{width:5px;height:22px;border-radius:1px}
.row .nm{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.row .nm small{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .p{font-family:var(--f-data)}
.row.me{background:color-mix(in srgb,var(--accent) 14%,var(--card));font-weight:600}
.gap{text-align:center;color:var(--mute);font-family:var(--f-data);font-size:12px;padding:2px;border-bottom:1px solid var(--line)}
.banner{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.banner.good{border-color:var(--good)}
.banner.bad{border-color:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-data);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
td.d{font-family:var(--f-data)}
textarea{width:100%;min-height:84px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;font-family:var(--f-data);font-size:13px;color:var(--ink);resize:none}
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.lapline{height:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 12px,transparent 12px 24px);opacity:.85;border-radius:1px}
.who .nm2{display:flex;flex-direction:column;gap:2px;min-width:0}
.ovr{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.ovr b{font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--accent)}
.ovr span{font-family:var(--f-data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.bar.r b{background:var(--bad)}
.rr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:0}
.rr.w{background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.rr .fl{font-size:20px;line-height:1}
.rr .gp{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.rr .gp small{color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.rs{font-family:var(--f-data);font-size:13px;min-width:54px;text-align:center;padding:3px 8px;border-radius:3px;border:1px solid var(--line);color:var(--mute)}
.rs.win{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.rs.pod{border-color:var(--good);color:var(--good);font-weight:700}
.rs.pts{color:var(--ink)}
.rs.out{border-color:var(--bad);color:var(--bad)}
.rs.miss{border-style:dashed}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt:disabled:hover{border-color:var(--line)}
.bar.n b{background:var(--accent)}
.traits{border-top:1px solid var(--line);padding-top:8px}
.traits summary{cursor:pointer;font-family:var(--f-data);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:4px 0}
.traits .stats{padding-top:8px}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idb{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 8px;min-height:44px;text-align:center;font-size:14px;overflow-wrap:anywhere}
.idb:hover{border-color:var(--accent)}
.idb.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.warn{border-left:3px solid var(--bad);padding:2px 0 2px 10px;font-size:13px;color:var(--bad)}
.news{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
#gear{position:fixed;bottom:14px;right:14px;z-index:50;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;line-height:1}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
</style>

function interviewEvent(rec){
  const k=rec.pos<=3?"good":(rec.pos>rec.field*.55||rec.dnf>=rec.races.length*.25)?"bad":"mid";
  const q=pick([...INTV[k],...INTV.any]);
  let ch=q.choices;
  if(q.text.includes("Кому присвячуєш")&&!ch.some(c=>c.gfc))ch=[...ch,{gfc:1,label:"Всім рідним і близьким",hint:"Тепло, трохи піднімає довіру дівчини",outs:[{p:1,msg:"Ти подякував рідним, і це було щиро. Вдома оцінили.",fx:{mod:2,opt:1,gf:4}}]}];
  return{id:"interview",title:"Інтерв'ю",text:q.text,choices:ch};
}
function traitStep(){
  const T=S.tr;
  S.trust.mgr=clamp(S.trust.mgr+(T.mod-50)*.04-(T.hyp-50)*.04);
  S.trust.mate=clamp(S.trust.mate+(T.mod-50)*.05-(T.ego-50)*.05);
  for(const k in T)T[k]=clamp(T[k]+(50-T[k])*.03);
}
function mindStep(rec,poor){
  const P=S.P;let msg="";
  const bad=poor||rec.pos>rec.field*.6;
  const load=3+S.cat*2.2+(bad?5:0)+(S.strikes?4:0)+P.rep/16+(rec.missed?2:0)+(S.tr.pes-50)*.06-(S.tr.opt-50)*.06;
  const relief=(P.stress+P.press)/12+(S.life.married?2:0)+(S.gf?(S.gfTrust>70?1.5:S.gfTrust<30?-2.5:0):0)+(S.cond&&S.cond.therapy?8:0);
  S.mind=clamp(S.mind+load-relief);
  if(S.cond){
    const c=S.cond,def=CONDS.find(x=>x.id===c.id);
    if(c.therapy){
      if(rnd()<.5+(P.work>60?.08:0)){msg=` Терапія допомогла: ${c.name} позаду.`;S.cond=null;S.mind=Math.min(S.mind,45)}
      else{msg=" Терапія триває, потрібен час.";for(const k in def.fx)P[k]=clamp(P[k]+def.fx[k]*.4,1,99)}
    }else{
      c.yrs++;for(const k in def.fx)P[k]=clamp(P[k]+def.fx[k],1,99);
      if(rnd()<.18){msg=` Стан (${c.name}) минув сам.`;S.cond=null}
      else msg=` ${c.name[0].toUpperCase()+c.name.slice(1)} без допомоги не відступає.`;
    }
  }else if(S.mind>50&&rnd()<clamp((S.mind-50)*.011,0,.5)){
    const c=pick(CONDS);S.cond={id:c.id,name:c.name,therapy:false,yrs:0};
    for(const k in c.fx)P[k]=clamp(P[k]+c.fx[k],1,99);
    msg=` Тебе накрило: ${c.name}. Варто поговорити з психологом.`;
  }
  return msg;
}

function evolveWorld(){
  const W=S.world,news=[];
  let reg=false;
  if(S.year>=W.nextReg){
    reg=true;W.nextReg=S.year+ri(5,7);
    const c=CATS[3],str=W.str[3],k=ri(0,c.teams.length-1);
    c.teams.forEach((t,i)=>{
      let a=clamp(t[1]*.5+38+gauss()*9,48,90);
      if(i<4)a=Math.max(a,74);
      if(i===k)a=Math.min(100,Math.max(a,80)+14);
      W.anc[3][i]=a;W.ref[3][i]=a;str[i]=clamp(a+gauss()*2,40,100);delete W.crisis["3-"+i];
    });
    news.push(`Новий технічний регламент Формули 1: розстановка сил змінилась. Найкращий болід тепер у ${c.teams[k][0]}`);
  }
  CATS.forEach((c,ci)=>{
    if(reg&&ci===3)return;
    const str=W.str[ci],top=str.map((s,i)=>[s,i]).sort((a,b)=>b[0]-a[0]).slice(0,3).map(x=>x[1]),mean=avg(str);
    const watch=ci===3||ci===S.cat;
    c.teams.forEach((t,i)=>{
      const key=ci+"-"+i,big=ci===3&&i<4,ref=W.ref[ci][i],old=str[i],cr=W.crisis[key];
      W.anc[ci][i]=clamp(W.anc[ci][i]+gauss()*1.3,ref-14,ref+14);
      let s;
      if(cr){
        cr.left--;
        if(cr.left<=0){delete W.crisis[key];s=W.anc[ci][i]+gauss()*2;if(watch)news.push(`${t[0]} виходить із кризи, болід знову швидкий`)}
        else s=old+gauss()*1.5;
      }else{
        s=old+(W.anc[ci][i]-old)*(big?.45:.15)+gauss()*2.2;
        if(!top.includes(i)&&old<mean&&rnd()<.07){const j=ri(9,15);s+=j;W.anc[ci][i]+=j*.7;if(watch)news.push(`${t[0]} (${c.id}): різкий стрибок уперед, болід став значно швидшим`)}
        else if(top.includes(i)&&rnd()<.09){
          const j=ri(8,13);s-=j;
          if(big)W.crisis[key]={left:ri(1,2)};else W.anc[ci][i]-=j*.7;
          if(watch)news.push(`${t[0]} (${c.id}) потрапляє в кризу, розробка боліда пішла не туди`);
        }
      }
      str[i]=clamp(s,30,100);
    });
  });
  const f1=W.f1,free=[],vac=[],AG=S.mode==='ageless';
  const age=d=>{if(AG)return;d.age++;const a=d.age;d.rate=clamp(d.rate+(a<=22?2.5+gauss()*1.5:a<=26?1+gauss()*1.2:a<=31?gauss()*1.1:a<=35?-.6+gauss():-1.6+gauss()),52,96)};
  const retires=d=>!AG&&d.age>=37&&rnd()<(d.age-36)*.14+(d.age>=42?.3:0);
  f1.forEach((pair,i)=>pair.forEach((d,k)=>{
    if(d.me)return;
    age(d);
    if(retires(d)){if(d.real)news.push(`${d.name} завершує кар'єру у Формулі 1`);pair[k]=null;vac.push([i,k])}
    else if(rnd()<.12||(d.rate<66&&rnd()<.3)){d.from=i;free.push(d);pair[k]=null;vac.push([i,k])}
  }));
  W.pool=W.pool.filter(d=>{age(d);return !retires(d)});
  const cands=[...free,...W.pool];W.pool=[];
  const need=vac.length-cands.length;
  if(!AG)for(let n=0;n<Math.max(0,need)+1;n++)cands.push(rookie(null));
  else while(cands.length<vac.length)cands.push(rookie(null));
  vac.sort((a,b)=>W.str[3][b[0]]-W.str[3][a[0]]);
  vac.forEach(([i,k])=>{
    let best=null,bs=-1e9;
    cands.forEach(d=>{const sc=d.rate+gauss()*3+(d.from===i?1.5:0);if(sc>bs){bs=sc;best=d}});
    cands.splice(cands.indexOf(best),1);
    const from=best.from;best.from=undefined;
    f1[i][k]=best;best.team=i;
    if(best.real&&best.rookie)news.push(`${best.name} дебютує у Формулі 1 за ${tname(3,i)}`);
    else if(best.real&&from!=null&&from!==i)news.push(`${best.name} переходить із ${tname(3,from)} до ${tname(3,i)}`);
    best.rookie=false;
  });
  cands.sort((a,b)=>b.rate-a.rate).forEach((d,n)=>{
    if(AG||(n<3&&d.rate>=68&&d.age<=34&&!d.rookie)){W.pool.push(d)}
    else if(d.real&&!d.rookie&&d.from!=null)news.push(`${d.name} залишає Формулу 1`);
  });
  W.news=news.slice(0,7);
}

function negotiate(kind){

  if(P.money<fee)return{ok:false,msg:`Не вистачає бюджету на послуги агента (потрібно ${fmtMoney(fee)}).`};
  P.money-=fee;S.nego--;
  const base=.3+S.loy*.003+(P.rep-40)*.006+(S.trust.mgr-50)*.004-(S.lastPct||0)*.35+(S.contractRank<=3?-.05:.05);
  if(kind==="salary"){

    S.trust.mgr=clamp(S.trust.mgr-3);return{ok:false,msg:"Команда не готова зараз брати довші зобов'язання."};
  }

    const diff=perf(P)-mate.rate;
    if(rnd()<clamp(.12+diff*.02+(P.rep-40)*.004+(S.trust.mgr-50)*.003,.05,.7)){S.role="first";S.salary=Math.min(SALCAP,Math.round(S.salary*1.08));S.trust.mate=clamp(S.trust.mate-6);return{ok:true,msg:"Тебе визнали першим пілотом. Пріоритет у стратегії та оновленнях боліда тепер за тобою, зарплата зросла. Напарник сприйняв це неоднозначно."}}

  }

  }

}

    S.weddingYear=S.year;
    if(S.gfTrust>=40){applyFx({money:-15,rep:2,cons:2,gf:12,set:{married:true}});screenGf({ok:true,text:`Гарне весілля! ${S.gf} тепер твоя дружина.`})}
    else{applyFx({gf:-5});screenGf({ok:false,text:`${S.gf} каже, що ще не готова. Спершу варто відновити довіру.`})}
  },
  gfYes(){
    S.proposedYear=S.year;
    const pr=S.gfTrust>=50?.9:S.gfTrust>=35?.55:.25;
    if(rnd()<pr){applyFx({money:-12,gf:12,rep:1,set:{engaged:true}});screenGf({ok:true,text:`${S.gf} сказала «так»! Ви заручені.`})}
    else{applyFx({money:-12,gf:-8,mind:4});screenGf({ok:false,text:`${S.gf} попросила ще час. Кільце лишилось у коробці.`})}
  },
  social(){screenSocial()},
  socialClose(){if(_saved!==null){setApp(_saved);_saved=null;const h=$("header.hud");if(h&&S)h.outerHTML=hud()}},
  post(v){const r=socialPost(v);screenSocial(r)},
  brk(){const b=$("#brkBox");if(b)b.innerHTML=`<p>Штраф: ${fmtMoney(S.salary)} (зарплата за один сезон)${S.P.money<S.salary?". Не вистачає бюджету.":""}</p>${S.P.money>=S.salary?`<button class="btn" data-a="brkYes">Так, розірвати</button>`:""}<button class="btn ghost" data-a="brkNo">Ні, лишитись</button>`},
  brkNo(){const b=$("#brkBox");if(b)b.innerHTML=`<button class="btn ghost" data-a="brk">Розірвати контракт</button>`},
  brkYes(){S.broke=CATS[3].teams[S.teamIdx][0];if(breakContract())screenOffers()},
  rand(){
    const c=pick(COUNTRIES);draft.rnd={country:c,name:randomName(c),story:pick(STORIES),idol:ri(0,IDOLS.length-1),gf:rnd()<.5?gfName(c):"",num:ri(1,99)};screenRand();
  },
  randGo(){const d=draft.rnd;draft.typed=false;draft.pend=[d.name,d.country,0,d.idol,d.story,{gf:d.gf,num:d.num}];screenMode()},
  mode(v){newCareer(...draft.pend);S.mode=v;S.userName=!!draft.typed;if(v==="legend")applyLegend();screenOffers()},
  origin(v){draft.origin=+v;keepForm(screenStart)},
  idol(v){draft.idol=+v;keepForm(screenStart)},
  begin(){const n=$("#nm").value.trim()||"Пілот";const num=Math.min(99,Math.max(1,parseInt($("#num").value)||44));draft.pend=[n,$("#ct").value,draft.origin,draft.idol,null,{gf:$("#gfn").value.trim(),num}];draft.typed=!!$("#nm").value.trim();screenMode()},
  team(v){chooseTeam(+v);if(S.cat===3)screenContract();else startPre()},
  nego(v){const r=negotiate(v);screenContract({ok:r.ok,text:r.msg})},
  start(){startPre()},
  choice(v){const o=resolve(S.ev,+v);screenOutcome(o)},
  after(){
    if(S.queue.length)showEvent();
    else if(S.flow==="interview"){S.flow=null;act.proceed()}
    else act.sim();
  },
  sim(){
    const rec=simSeason(S.teamIdx);S.rec=rec;
    const a=closeSeason(rec);S.after=a;screenResult(rec,a);
  },
  next(){
    if(S.after.end){screenEnd(S.after.end);return}
    if(rnd()<.8){S.ev=interviewEvent(S.rec);S.flow="interview";S.queue=[];screenEvent();return}
    act.proceed();
  },
  proceed(){
    if(S.cat===3&&S.contract>0&&!S.after.fired){const tl=transferOffers();if(tl.length){screenTransfer(tl);return}}
    if(S.cat===3&&S.contract>0&&!S.after.fired){S.contract--;S.grid=makeGrid();S.nego=2;screenContract();return}
    screenOffers();
  },
  copy(){
    const ta=$("#sh");
    try{navigator.clipboard.writeText(ta.value).catch(()=>{ta.select()})}catch(e){ta.select()}
    ta.select();
  },
  retire(){const b=$("#retireBox");if(b)b.innerHTML=`<p>Точно завершити кар'єру?</p><button class="btn" data-a="retireYes">Так, завершити</button><button class="btn ghost" data-a="retireNo">Ні, продовжити</button>`},
  retireNo(){const b=$("#retireBox");if(b)b.innerHTML=`<button class="btn ghost" data-a="retire">Завершити кар'єру</button>`},
  retireYes(){vacate();screenEnd("Ти сам вирішив завершити кар'єру на власних умовах.")},
  restart(){screenStart()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset.v)});
loadSet();
screenStart();
</script>

</body></html>
